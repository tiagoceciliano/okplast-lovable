 <!doctype html>
<html lang="pt-BR">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <!-- Favicon -->
   <link rel="apple-touch-icon" href="/favicon.png" />
   
    <!-- Performance: Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://osfxdoxfiyyqcpahuwci.supabase.co" />
    <link rel="dns-prefetch" href="https://osfxdoxfiyyqcpahuwci.supabase.co" />

    <!-- Google Fonts injetado após o primeiro paint (não bloqueia render).
         display=optional garante que, se não vier a tempo, usa o fallback sem CLS. -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=optional" />
    </noscript>
    
   <!-- PWA Manifest -->
   <link rel="manifest" href="/manifest.json" />
   <meta name="theme-color" content="#1a3a5c" />

   <!-- Default SEO (overridden per-route via react-helmet-async) -->
   <title>OK Plast | Distribuidora de Chapas Plásticas no RJ</title>
   <meta name="description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida e entrega rápida." />

   <!-- Open Graph -->
   <meta property="og:type" content="website" />
   <meta property="og:site_name" content="OK Plast" />
   <meta property="og:title" content="OK Plast | Distribuidora de Chapas Plásticas no RJ" />
   <meta property="og:description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida." />
   <meta property="og:url" content="https://okplast.com.br/" />
   <meta property="og:image" content="https://okplast.com.br/og-image.jpg" />
   <meta property="og:locale" content="pt_BR" />

   <!-- Twitter -->
   <meta name="twitter:card" content="summary_large_image" />
   <meta name="twitter:title" content="OK Plast | Distribuidora de Chapas Plásticas no RJ" />
   <meta name="twitter:description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida." />
   <meta name="twitter:image" content="https://okplast.com.br/og-image.jpg" />
</head>

 <body>
   <div id="root"></div>
   <script type="module" src="/src/main.tsx"></script>
    <!-- Google Fonts (Montserrat) carregado após o load para não bloquear render. -->
    <script>
      (function () {
        function loadFonts() {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = 'https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=optional';
          document.head.appendChild(l);
        }
        if (document.readyState === 'complete') {
          loadFonts();
        } else {
          window.addEventListener('load', loadFonts);
        }
      })();
    </script>
    <!-- Google Tag (gtag.js AW-18068965569): injeção única, após load, com guarda
         para evitar duplicata caso a plataforma também injete. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      function loadGtag(){
        if (window.__gtagLoaded) return;
        // Se algum script (ex: plataforma) já injetou o mesmo ID, não duplica.
        var existing = document.querySelector('script[src*="googletagmanager.com/gtag/js"]');
        if (existing) { window.__gtagLoaded = true; return; }
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18068965569';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'AW-18068965569');
      }
      function scheduleGtag(){
        if (window.requestIdleCallback) {
          window.requestIdleCallback(loadGtag, { timeout: 3000 });
        } else {
          setTimeout(loadGtag, 2000);
        }
      }
      if (document.readyState === 'complete') {
        scheduleGtag();
      } else {
        window.addEventListener('load', scheduleGtag);
      }
    </script>
 </body>
</html>
