    <!-- Google tag (gtag.js) — injetado após load para não competir com hidratação -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      function loadGtag(){
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18068965569';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'AW-18068965569');
      }
      function scheduleGtag(){
        if (window.requestIdleCallback) {
          window.requestIdleCallback(loadGtag, { timeout: 2000 });
        } else {
          setTimeout(loadGtag, 1);
        }
      }
      if (document.readyState === 'complete') {
        scheduleGtag();
      } else {
        window.addEventListener('load', scheduleGtag);
      }
    </script>
