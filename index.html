 <!doctype html>
<html lang="pt-BR">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <!-- Evita que o HTML fique preso em cache do navegador/CDN entre deploys.
        Assets com hash (JS/CSS) continuam cacheados normalmente. -->
   <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
   <meta http-equiv="Pragma" content="no-cache" />
   <meta http-equiv="Expires" content="0" />
   
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18068965569"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18068965569');
    </script>
    
   <!-- Favicon -->
   <link rel="apple-touch-icon" href="/favicon.png" />
   
    <!-- Performance: Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://osfxdoxfiyyqcpahuwci.supabase.co" />
    <link rel="dns-prefetch" href="https://osfxdoxfiyyqcpahuwci.supabase.co" />
     
    <!-- Google Fonts: non-render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- Preload recursos críticos (LCP) -->
    <link rel="preload" as="image" href="/logo-horizontal.png" fetchpriority="high" />
    
   <!-- PWA Manifest -->
   <link rel="manifest" href="/manifest.json" />
   <meta name="theme-color" content="#1a3a5c" />

   <!-- Default SEO (overridden per-route via react-helmet-async) -->
   <title>OK Plast | Distribuidora de Chapas Plásticas no RJ</title>
   <meta name="description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida e entrega rápida." />

   <!-- Open Graph -->
   <meta property="og:type" content="website" />
   <meta property="og:site_name" content="OK Plast" />
   <meta property="og:title" content="OK Plast | Distribuidora de Chapas Plásticas no RJ" />
   <meta property="og:description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida." />
   <meta property="og:url" content="https://okplast.com.br/" />
   <meta property="og:image" content="https://okplast.com.br/og-image.jpg" />
   <meta property="og:locale" content="pt_BR" />

   <!-- Twitter -->
   <meta name="twitter:card" content="summary_large_image" />
   <meta name="twitter:title" content="OK Plast | Distribuidora de Chapas Plásticas no RJ" />
   <meta name="twitter:description" content="Distribuidora de chapas plásticas no RJ: acrílico, policarbonato, PETG, PS, PVC e ACM. Corte sob medida." />
   <meta name="twitter:image" content="https://okplast.com.br/og-image.jpg" />
</head>

 <body>
   <div id="root"></div>
   <script type="module" src="/src/main.tsx"></script>
 </body>
</html>
